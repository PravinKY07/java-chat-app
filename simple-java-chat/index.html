<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A beginner-friendly chat application with a Java backend."
    />
    <title>Simple Chat Application</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="chat-card" aria-labelledby="page-title">
        <header class="chat-header">
          <h1 id="page-title">Simple Chat Application</h1>
          <p class="subtitle">Share the link. Everyone sees the same messages.</p>
        </header>

        <div class="chat-toolbar">
          <label class="display-name" for="sender-name">Your name</label>
          <input
            id="sender-name"
            type="text"
            maxlength="30"
            placeholder="Guest"
            autocomplete="nickname"
          />
        </div>

        <ol id="message-list" class="message-list" aria-label="Chat messages">
          <li class="empty-state">No messages yet. Send the first one.</li>
        </ol>

        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message-input">Your message</label>
          <input
            id="message-input"
            name="message"
            type="text"
            maxlength="500"
            placeholder="Write a message..."
            autocomplete="off"
            required
          />
          <button id="send-button" type="submit">Send</button>
        </form>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
